services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: billetera
      POSTGRES_PASSWORD: billetera
      POSTGRES_DB: billetera
    volumes:
      - billetera_pg:/var/lib/postgresql/data
    networks:
      - billetera
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billetera -d billetera"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  billetera-api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://billetera:billetera@postgres:5432/billetera
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - billetera

networks:
  billetera:

volumes:
  billetera_pg:
