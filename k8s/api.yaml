apiVersion: apps/v1
kind: Deployment
metadata:
  name: billetera-api
  namespace: billetera
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billetera-api
  template:
    metadata:
      labels:
        app: billetera-api
    spec:
      containers:
        - name: api
          image: billetera-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: billetera-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: billetera-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: billetera-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: billetera-api
  namespace: billetera
spec:
  type: NodePort
  selector:
    app: billetera-api
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
