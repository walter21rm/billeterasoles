apiVersion: apps/v1
kind: Deployment
metadata:
  name: billetera-postgres
  namespace: billetera
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billetera-postgres
  template:
    metadata:
      labels:
        app: billetera-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: billetera-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billetera-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: billetera-secret
                  key: POSTGRES_DB
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "billetera", "-d", "billetera"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "billetera", "-d", "billetera"]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: billetera-postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: billetera-postgres-data
  namespace: billetera
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: billetera-postgres
  namespace: billetera
spec:
  selector:
    app: billetera-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
