apiVersion: apps/v1
kind: Deployment
metadata:
  name: retiros-api
  namespace: retiros
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retiros-api
  template:
    metadata:
      labels:
        app: retiros-api
    spec:
      initContainers:
        - name: migrate
          image: docker.io/library/withdrawal-soles:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "for i in $(seq 1 30); do alembic upgrade head && exit 0; sleep 2; done; exit 1"]
          env:
            - name: WITHDRAWAL_SOLES_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: retiros-secret
                  key: DATABASE_URL
      containers:
        - name: api
          image: docker.io/library/withdrawal-soles:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "withdrawal_soles.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: WITHDRAWAL_SOLES_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: retiros-secret
                  key: DATABASE_URL
            - name: WITHDRAWAL_SOLES_WALLET_SERVICE_URL
              value: http://billetera-api.billetera.svc.cluster.local:3000
            - name: WITHDRAWAL_SOLES_USERS_SERVICE_URL
              value: http://usuarios-ejemplo.billetera.svc.cluster.local:3001
            - name: WITHDRAWAL_SOLES_USER_SERVICE_URL
              value: http://retiros-dependencias.retiros.svc.cluster.local:8001
            - name: WITHDRAWAL_SOLES_TRANSACTION_SERVICE_URL
              value: http://retiros-dependencias.retiros.svc.cluster.local:8001
            - name: WITHDRAWAL_SOLES_WALLET_JWT_SECRET
              value: dev-only-change-me
            - name: WITHDRAWAL_SOLES_WALLET_JWT_ISSUER
              value: billetera-dev
            - name: WITHDRAWAL_SOLES_WALLET_JWT_SUBJECT
              value: retiros
            - name: WITHDRAWAL_SOLES_USERS_JWT_SECRET
              value: dev-only-change-me
            - name: WITHDRAWAL_SOLES_USERS_JWT_ISSUER
              value: billetera-dev
            - name: WITHDRAWAL_SOLES_USERS_JWT_SUBJECT
              value: billetera-service
            - name: WITHDRAWAL_SOLES_AUTH_JWT_SECRET
              value: dev-only-change-me
            - name: WITHDRAWAL_SOLES_AUTH_JWT_ISSUER
              value: billetera-dev
            - name: WITHDRAWAL_SOLES_AUTH_JWT_ALLOWED_SUBJECTS
              value: retiros
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: retiros-api
  namespace: retiros
spec:
  selector:
    app: retiros-api
  ports:
    - name: http
      port: 8000
      targetPort: http
